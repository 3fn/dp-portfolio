## Build & Serve
dev: npm run dev (Astro dev server + esbuild watch, concurrent)
build: npm run build (copy:tokens → build:scripts → astro build)
output: _site/ (deployed to Dreamhost via SFTP)
scripts-tool: esbuild (separate from Vite — Shadow DOM CSS-as-text requires --loader:.css=text)
static-assets: public/ (tokens, scripts, fonts, illustration, images, brand — copied verbatim to _site/)
page-source: src/pages/index.astro (Astro layout + page content)
css: src/styles/portfolio.css (imported by Astro layout, processed by Vite)

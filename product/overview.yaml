# DP-Portfolio — Product Overview

## Product Context
name: DP-Portfolio
abbreviation: DPP
description: Single-page portfolio site showcasing the DesignerPunk ecosystem — built for small teams, founders, and builders who pair human creative direction with AI precision
domain: Portfolio / professional marketing
audience: Small teams (1-10), founders building 0-to-1, design system practitioners, builders leveraging AI collaboration
type: Single-page scroll-based website
designerpunk-version: 11.8.0

## Key Characteristics
- Content-driven, narrative structure (hook → credibility → insight → ecosystem → methodology → value → CTA)
- 0-to-1 positioning: infrastructure that enables small teams to compete at scale
- Scroll-reveal progressive disclosure
- Scroll-driven token evolution animation (split-flap, 4 phases)
- Restrained color strategy with action-primary (pink) accent
- Noise textures at varying densities for tactile quality
- Interactive data visualizations (chord diagram, career chart)
- FLIP-animated ecosystem modals with system visualizations
- Custom typography (Rajdhani display, Figtree body, Commit Mono code)
- Stats-forward credibility building ("1 Human" hero stat)
- Personal, 1st-person voice with easter egg personality
- Product tokens for layout constraints and motion characteristics
- Tone: empowering, punk (punch up at systems, not down at people)


# ─── INTERACTION SPECIFICATIONS ───────────────────────────────────

interactions:

  # ─── ECOSYSTEM MODAL (FLIP) ───────────────────────────────────
  - name: ecosystem-modal
    technology: DOM + CSS transitions + JS FLIP measurement
    trigger: click on any .ecosystem__system card
    implementation-approach: |
      FLIP pattern (First-Last-Invert-Play):
      1. On click: capture card's getBoundingClientRect() (First)
      2. Set modal content (header, desc, highlights, stats, viz)
      3. Calculate modal's final centered position and size (Last)
      4. Apply transform that maps modal from card position/size to its current position (Invert)
      5. Force reflow (read offsetHeight)
      6. Remove transform — CSS transition animates to final state (Play)
      Reverse on close: calculate transform back to card, apply, fade out.
    states:
      closed:
        modal: opacity 0, pointer-events none, transform none
        backdrop: opacity 0, pointer-events none
      opening:
        js-action: capture card rect, set modal position/width, calculate inverse transform
        modal: opacity 0 → 1, transform (card-position/scale) → (0,0)/scale(1)
        backdrop: opacity 0 → 1
        timing: product-motion-flip-duration (duration350), product-motion-flip-easing
      open:
        modal: opacity 1, pointer-events auto, transform translate(0,0) scale(1)
        backdrop: opacity 1, pointer-events auto
        focus: trapped within modal (inert on background)
      closing:
        js-action: calculate transform back to triggering card's current rect
        modal: transform → (card-position/scale), opacity → 0
        backdrop: opacity → 0
        timing: same as opening
        on-complete: remove active classes, restore pointer-events, remove inert, return focus to trigger card
    close-triggers:
      - backdrop click
      - Escape key (document keydown listener)
      - close button click
    reduced-motion:
      opening: instant show (opacity 0→1, no transform animation)
      closing: instant hide (opacity 1→0, no transform)
    a11y:
      - Modal gets role="dialog", aria-modal="true"
      - Focus moves to modal on open (first focusable element or modal container)
      - Focus trapped via inert attribute on body content behind backdrop
      - Focus returns to triggering card on close
      - Escape key always closes

  # ─── ECOSYSTEM CONNECTORS ─────────────────────────────────────
  - name: ecosystem-connectors
    technology: SVG (dynamically drawn via JS)
    trigger: illustration <object> load event + window resize
    implementation-approach: |
      1. Wait for illustration object to load (load event + double requestAnimationFrame for layout stability)
      2. Read pointer-location circle cx/cy from illustration's contentDocument
      3. Scale cx/cy by (rendered size / viewBox size) to get page-relative coordinates
      4. For each system card: calculate nearest edge midpoint
      5. Draw SVG <line> from card edge to illustration target point
      6. Draw shadow dot (larger, dark) + color dot (smaller, system color) at target
      7. Redraw on window resize
    colors:
      rosetta: cyan-200 (#80F6FF)
      stemma: green-200 (#80FFBB)
      civitas: "#FCF680" (application-level — no yellow primitive)
    line-properties:
      stroke-width: 2.5
      shadow-dot-radius: 7, fill rgba(10,10,15,0.3)
      color-dot-radius: 5
    svg-filter: feDropShadow dx=3 dy=2 stdDeviation=4 flood-color rgba(10,10,15,0.4)

  # ─── CHORD DIAGRAM ───────────────────────────────────────────
  - name: chord-diagram
    technology: canvas-2d
    note: "Canvas states are render-loop states, not DOM states"
    trigger: page load (lazy — IntersectionObserver threshold 0.1)
    lifecycle:
      start: IntersectionObserver fires when canvas 10% visible → begin requestAnimationFrame loop
      pause: IntersectionObserver fires when canvas exits viewport → cancel requestAnimationFrame
      resume: IntersectionObserver fires when canvas re-enters → restart loop
    states:
      idle:
        behavior: slow continuous rotation (IDLE_SPEED 0.0004 rad/frame)
        pulse-dots: travel along chord paths (speed 0.0018 + random * 0.002)
        node-labels: visible at reduced opacity (large 0.8, small 0.55)
      hover-node:
        trigger: mouse within 16px of a node center
        behavior: |
          - Spin decelerates to stop (lerp toward 0 at HOVER_DECEL 0.07)
          - Hovered node: larger radius (+2.5), full opacity label, hover halo
          - Connected chords: opacity increases to 0.62
          - Unconnected chords: remain at 0.10
          - Tooltip appears (positioned at cursor + 16px offset)
        tooltip: shows node label + description, border-color matches node category
      drag:
        trigger: mousedown on center root node (within rootR + 8px)
        behavior: |
          - Cursor changes to grabbing
          - Rotation follows mouse angle (spinVelocity = angle delta * 0.8)
          - On mouseup: dragging stops, spin velocity decays naturally
    rendering:
      outer-ring: shortSide * 0.40 radius, 3 groups (MCP/Agents/Systems)
      inner-ring: shortSide * 0.245 radius, 2 groups (Tokens/Components)
      root-node: shortSide * 0.075 radius, "DESIGNER PUNK" label
      arc-bands: group color at 0.15 opacity (outer) / 0.12 (inner)
      chords: quadratic bezier curves, weight from connection data * 1.5
      nodes: white fill (0.9 opacity), colored stroke (1.5px / 2px hover)
    colors: application-level (PAL object — see Spec 002 canvas-chord.md for full palette)
    fonts: 7-10px ui-monospace (documented exception — below type scale)
    reduced-motion:
      idle: static render at initial rotation (no spin, no pulse dots)
      hover: still functional (tooltip, chord highlighting)
      drag: still functional

  # ─── CAREER CHART ─────────────────────────────────────────────
  - name: career-chart
    technology: canvas-2d
    note: "Canvas states are render-loop states, not DOM states"
    trigger: IntersectionObserver, threshold 1.0 (fully visible before animating)
    lifecycle:
      start: observer fires → begin grow animation
      complete: animT reaches 1.0 AND no hover → stop requestAnimationFrame
      re-enter: hover triggers restart of loop (for highlight rendering)
    states:
      pre-animation:
        behavior: canvas blank (nothing rendered until intersection)
      animating:
        behavior: |
          - Bars grow from baseline (mid) outward using easeOut curve
          - Design bars grow upward, engineering bars grow downward
          - Duration: ~2 seconds (animT increments at dt * 0.5)
          - Noise texture pattern overlaid on bars during growth
        timing: easeOut (1 - Math.pow(1-t, 3))
      static:
        behavior: bars at full height, labels visible, dots on baseline
      hover:
        trigger: mouse within segment bounds (sx1-4 to sx2+4, mid-dh-8 to mid+eh+8)
        behavior: |
          - Hovered segment: dot enlarges (3.5 → 5), label bolds, color full opacity
          - Tooltip appears (positioned at cursor + 18px, flips left if near right edge)
          - requestAnimationFrame restarts for re-render
    rendering:
      layout: PAD top=40, bottom=44, left=16, right=16
      aspect-ratio: width * 0.32 height
      baseline: horizontal line at vertical center
      grid: vertical lines every year (2006-2026), 0.5px, rgba(178,188,196,0.15)
      bars: full segment width, gradient fills (design: pink/purple, engineering: gray/dark)
      noise: canvas pattern (256px, density 0.8, alpha 24)
    colors: application-level (see Spec 002 canvas-career.md for full palette)
    fonts: 9-10px ui-monospace (documented exception)
    reduced-motion:
      animating: skip to static state immediately (bars at full height, no grow)
      hover: still functional

  # ─── AGENT PORTRAITS ──────────────────────────────────────────
  - name: agent-portraits
    technology: DOM + SVG contentDocument manipulation
    trigger: mouseenter/mouseleave on .agents__list li elements
    prerequisite: all 3 portrait <object> elements must fire load event before interaction initializes
    fallback: if any portrait fails to load, interaction is disabled (portraits remain in luminosity blend mode)
    states:
      idle:
        portraits: mix-blend-mode luminosity (desaturated)
      hover-agent:
        trigger: mouseenter on a list item containing .agents__agent-name with id="directory__{name}"
        behavior: |
          - Derive portrait ID: "portrait__{name}" from the agent name element's ID
          - Find matching element in portrait SVG contentDocuments
          - Set matched portrait's parent <object> to mix-blend-mode normal
          - Set all portrait__* elements to opacity 0.3 EXCEPT the matched one (opacity 1)
          - Transition: opacity 0.2s ease
        on-leave: |
          - Reset all <object> mix-blend-mode to empty (reverts to luminosity)
          - Reset all portrait__* elements to opacity 1
    a11y: |
      Interaction is hover-only (enhancement). No keyboard equivalent needed — the agent information
      is fully accessible via the text list below the portraits. Portraits are aria-hidden.

  # ─── EASTER EGGS ──────────────────────────────────────────────
  - name: easter-eggs
    technology: CSS (hover trigger + keyframe animation)
    instances:
      - section: why-build
        trigger: hover on h2.why-build__heading
        target: p.why-build__easter ("Because why not!?")
        color: green-100
        animation: neon-flicker (green glow — rgba(51,255,153))
      - section: how-built
        trigger: hover on h2.how-built__heading
        target: p.how-built__easter ("Hard $#@%ing work!")
        color: pink-100
        animation: neon-flicker-pink (pink glow — rgba(255,42,109))
    mechanism: |
      CSS adjacent sibling selector: .heading:hover ~ .easter { opacity 1; animation: neon-flicker }
      No JavaScript required.
    animation-spec:
      name: neon-flicker / neon-flicker-pink
      duration: product-motion-flicker-duration (800ms)
      easing: ease-out
      fill-mode: forwards
      keyframes: |
        0%: opacity 0, no text-shadow
        10%: opacity 1, small glow (8px)
        15%: opacity 0.2, no glow
        25%: opacity 1, medium glow (16px)
        30%: opacity 0.4, tiny glow
        40%: opacity 0, no glow
        50%: opacity 1, large glow (24px + 40px)
        55%: opacity 0.7, medium glow
        65-100%: opacity 1, full glow (24px + 32px + 40px)
    reduced-motion:
      behavior: instant reveal at full opacity + full glow (no flicker animation)
      implementation: "@media (prefers-reduced-motion: reduce) { animation: none; opacity: 1; text-shadow: full glow; }"
    a11y: |
      Easter egg text is aria-hidden="true" (decorative/humorous, not informational).
      No keyboard trigger — hover-only enhancement.

# ─── ACCESSIBILITY SPECIFICATION ──────────────────────────────────

accessibility:

  skip-to-content:
    element: a
    href: "#hero"
    content: "Skip to content"
    position: first focusable element in <body>, visually hidden until focused
    tokens:
      focused: position absolute, top space100, left space100, z-index 9999, background color.structure.canvas, padding space100 space200, border-radius radius.small

  landmarks:
    - nav[aria-label="Site navigation"]
    - main (wraps all sections)
    - section#hero
    - section#stats
    - section#why-build
    - section#ecosystem
    - section#how-built
    - section#enterprise (includes code-shots as non-landmark div)
    - section#who-built (includes agents + thanks as non-landmark divs)
    - section#cta
    - footer
    total: 11 landmarks (reduced from 14 per optimization decision)

  heading-hierarchy:
    h1: "The design system built for AI-Human collaboration" (hero — single instance)
    h2:
      - "Why build this system?" (why-build)
      - "What is this ecosystem?" (ecosystem)
      - "How was this system built?" (how-built)
      - "What makes this system enterprise-grade?" (enterprise)
      - "Who built, and maintains, this system?" (who-built)
      - "What can I accomplish with your team?" (cta)
    h3:
      - "Challenge", "Insight", "Approach", "Goals" (why-build cards)
      - "Agents" (agents subsection title)
      - "Special thanks to:" (thanks title)
      - Enterprise feature titles × 6
    h4:
      - "Design system agents", "Product system agents", "Product implementation agents" (agent role headers)

  focus-management:
    ecosystem-modal:
      on-open: move focus to modal container (or first focusable element within)
      while-open: trap focus within modal (apply inert attribute to all content behind backdrop)
      on-close: return focus to the triggering .ecosystem__system card
      escape-key: closes modal (document-level keydown listener)
    nav-links:
      about-link: scrolls to #about (who-built section), focus moves to section heading
    skip-to-content:
      on-activate: focus moves to #hero section

  decorative-elements:
    aria-hidden-true:
      - All .section-prefix spans ("//" decorative text)
      - Hero illustration (<object>)
      - Chord diagram canvas
      - Career chart canvas
      - Ecosystem system illustration (<object>)
      - Ecosystem connector SVG
      - Ecosystem system header SVGs (aria-label provides accessible name instead)
      - Agent portrait SVGs
      - Code-shot SVGs
      - Easter egg text (decorative/humorous)
      - Footer separator ("◇")
      - Chord tooltip (positioned, not focusable)
      - Career tooltip (positioned, not focusable)

  text-alternatives:
    chord-diagram:
      type: visually-hidden description
      content: "Interactive diagram showing relationships between DesignerPunk's MCP servers, AI agents, and system components including Rosetta (tokens), Stemma (components), and their connections."
      element: p.sr-only (adjacent to or wrapping the canvas container)
    career-chart:
      type: visually-hidden data table
      content: table with columns (Employer, Period, Design%, Engineering%)
      data-source: ALL_ROLES array in career chart script
      element: table.sr-only (adjacent to canvas, populated from same data)
    ecosystem-illustration:
      type: none needed (decorative — system descriptions are in adjacent text cards)

  interactive-elements:
    nav-links:
      - "About" (a[href="#about"]) — accessible name from text content
      - "GitHub" (a[href="..."][target="_blank"]) — consider aria-label "GitHub (opens in new tab)"
      - "LinkedIn" (a[href="..."][target="_blank"]) — consider aria-label "LinkedIn (opens in new tab)"
    hero-ctas:
      - "Explore the ideas" (Button-CTA, primary) — accessible name from label
      - "Investigate the code" (Button-CTA, secondary, external) — consider aria-label with "(opens in new tab)"
    ecosystem-cards:
      - Each .ecosystem__system card is clickable — needs role="button" or <button> wrapper
      - Accessible name from the system header SVG's aria-label ("Rosetta", "Stemma", "Civitas")
      - Keyboard: Enter/Space activates (opens modal)
    ecosystem-modal:
      - Close button: aria-label="Close"
      - Modal container: role="dialog", aria-modal="true", aria-labelledby (header SVG's aria-label)
    cta-buttons:
      - "Peter on LinkedIn" (external) — aria-label "Peter on LinkedIn (opens in new tab)"
      - "DesignerPunk on GitHub" (external) — aria-label "DesignerPunk on GitHub (opens in new tab)"

  reduced-motion-summary:
    trigger: "@media (prefers-reduced-motion: reduce)"
    affected-elements:
      - Scroll-reveal animations: disabled, elements immediately visible
      - Nav color transitions: instant snap (no CSS transition)
      - Chord diagram: static render, no idle spin, no pulse dots
      - Career chart: bars render at full height immediately, no grow animation
      - Ecosystem modal: instant show/hide, no FLIP transform animation
      - Easter eggs: instant reveal at full opacity, no neon flicker keyframe
      - Card hover transitions: instant state change (no 150ms transition)
      - Button/link opacity transitions: instant (no 150ms ease)
    implementation: |
      Single media query block that:
      1. Sets transition-duration: 0s on all animated elements
      2. Sets animation: none on keyframe-animated elements
      3. Sets reveal elements to their final visible state
      4. Chord/career scripts check window.matchMedia('(prefers-reduced-motion: reduce)') at init

name: portfolio
type: marketing-page
tags: [portfolio, marketing, single-page, scroll-based, ai-collaboration]
status:
  spec: complete
  web: not-started
  ios: not-applicable
  android: not-applicable

ux-direction: |
  Single-page portfolio showcasing the DesignerPunk design system.
  Narrative arc: hook → credibility → problem/insight → ecosystem → methodology → value → social proof → CTA.
  Desktop-priority with responsive behavior at 3 breakpoints.
  Audience: hiring managers, design system professionals, engineering leaders.

visual-reference: docs/specs/staticReview/hero-exploration.html
visual-reference-note: |
  The prototype is the visual/behavioral source of truth for appearance and interaction feel.
  This screen spec is the implementation source of truth for semantic structure, token usage, and accessibility.
  Where they conflict, this spec takes precedence for implementation decisions.

# ─── PAGE-LEVEL ARCHITECTURE ──────────────────────────────────────

page-architecture:
  semantic-structure:
    root: body
    nav: nav[aria-label="Site navigation"] (sticky, z-index above all content)
    main: main (wraps all sections)
    sections: section × 11 (hero, stats, why-build, ecosystem, how-built, enterprise, code-shots, who-built, agents, thanks, cta)
    footer: footer

  heading-hierarchy:
    h1: "The design system built for AI-Human collaboration" (hero, single instance)
    h2: Section headings × 7 (why-build, ecosystem, how-built, enterprise, who-built, cta + agents title as h3)
    h3: Card headings (why-build cards), enterprise item titles, agents role headers, thanks title
    h4: Not used

  skip-to-content:
    target: "#hero"
    label: "Skip to content"
    position: first focusable element in body

  css-load-order:
    1: dist/tokens/DesignTokens.web.css
    2: dist/tokens/product/ProductTokens.web.css
    3: src/assets/fonts/figtree/figtree.css
    4: src/assets/fonts/commit-mono/commit-mono.css
    5: src/styles/layout.css
    6: src/styles/sections.css (or per-section files)

  script-architecture:
    type: ES2022 modules
    strategy: per-concern splitting
    scripts:
      - src/scripts/scroll-nav.ts (IntersectionObserver for nav color)
      - src/scripts/reveal.ts (scroll-reveal animations)
      - src/scripts/chord.ts (chord diagram canvas)
      - src/scripts/career.ts (career chart canvas)
      - src/scripts/ecosystem.ts (modal FLIP + connector lines)
      - src/scripts/agents.ts (portrait hover interaction)
    loading: defer on all scripts; canvas scripts lazy-loaded via IntersectionObserver

  responsive-strategy:
    breakpoints:
      desktop: "≥1024px (breakpointLg) — primary design target, 12-column grid"
      tablet: "768px–1023px (breakpointMd–breakpointLg) — 8-column grid, column reductions"
      mobile: "<768px (below breakpointMd) — 4-column grid, single column, stacked"
    content-max-width: product-layout-content-max-width (1336px)
    content-indent: product-layout-content-indent (space300 = 24px)
    section-pattern: full-bleed background, constrained content column centered

  reduced-motion:
    policy: "All animations disabled. Elements render in final state immediately."
    affected:
      - Scroll-reveal (elements visible without translateY/opacity transition)
      - Chord diagram (static render, no idle spin, no pulse dots)
      - Career chart (bars at full height immediately, no grow animation)
      - Ecosystem modal (instant show/hide, no FLIP transform)
      - Easter eggs (instant reveal at full opacity, no flicker keyframe)
      - Nav color transitions (instant snap, no CSS transition)

  performance:
    above-fold: nav + hero section (critical rendering path)
    critical-css: Inline nav + hero styles in <head> for fastest first paint; load remaining styles async
    lazy-loaded:
      - Chord diagram canvas (IntersectionObserver, threshold 0.1)
      - Career chart canvas (IntersectionObserver, threshold 1.0)
      - Ecosystem connector lines (drawn after illustration loads)
      - CTA background image (IntersectionObserver — do not load via CSS background-image directly; apply class when in view)
    font-display: swap (prevent FOIT)
    font-strategy: |
      Self-host Rajdhani (eliminate Google Fonts external request).
      Subset to weights 500/600/700, Latin characters only (~30-40KB total).
      Figtree and Commit Mono already self-hosted.

  optimizations:
    svg-loading: |
      All SVGs use <object type="image/svg+xml"> — not <img>.
      Rationale: <img> renders SVGs without CSS cascade access and often rasterizes poorly.
      Code-block SVGs (purely decorative, below fold) may use loading="lazy" attribute on the <object> if supported, otherwise rely on natural document order.

    canvas-lifecycle: |
      Chord diagram: Add IntersectionObserver to pause requestAnimationFrame loop when not in viewport.
      Career chart: Already pauses after animation completes — no change needed.
      Ecosystem connectors: Static draw, no lifecycle concern.

    canvas-technology: |
      Chord diagram: Canvas 2D (continuous rotation, drag, pulse animations are frame-based).
      Career chart: Canvas 2D (noise texture compositing via pattern fill — not achievable with equivalent quality in SVG).
      Ecosystem connectors: SVG (simple lines + dots, benefits from DOM positioning).
      Decision: Keep current technology choices. SVG alternatives evaluated and rejected for chord/career due to noise texture and continuous animation requirements.

    section-consolidation: |
      Reduce landmark count from 14 to 11:
      - code-shots: becomes <div> within or after enterprise section (not its own <section>)
      - agents + thanks: become subsections within who-built (using heading hierarchy, not separate <section> landmarks)
      Rationale: Fewer landmarks = more navigable for screen reader users.

    background-image: |
      CTA section bkgrnd-peter.jpg (808KB source):
      - Compress to quality 75-80 (target: 200-300KB)
      - Resize to max rendered width (1336px)
      - Convert to WebP with JPEG fallback (target: 150-200KB)
      - Lazy-load via IntersectionObserver (apply background-image class when CTA section enters viewport)
      - Use progressive encoding if JPEG fallback

    css-strategy: |
      Single combined stylesheet (not per-section files) — one request, HTTP/2 makes splitting negligible for single-page site.
      Critical CSS (nav + hero) inlined in <head> for first paint.
      Remaining styles loaded via <link rel="stylesheet"> with standard blocking (acceptable — above-fold is covered by inline).
      No unused token elimination in v1 — full DesignTokens.web.css loaded. Tree-shaking is a future build optimization.

    canvas-accessibility: |
      Chord diagram: aria-hidden="true" on canvas. Add visually-hidden description summarizing the visualization's purpose:
        "Interactive diagram showing relationships between DesignerPunk's MCP servers, AI agents, and system components."
      Career chart: aria-hidden="true" on canvas. Add visually-hidden table with career data (employer, period, design%, engineering%) — data already exists in JS ALL_ROLES array.
      Rationale: Canvas content is meaningful (not decorative) but cannot be made directly accessible. Text alternatives provide equivalent information.

    focus-management: |
      Ecosystem modal: Implement focus trap when open.
      Approach: Apply inert attribute to all content behind the modal backdrop, or use a focus-trap utility that constrains Tab/Shift+Tab to modal contents.
      On close: Return focus to the triggering card element.
# ─── ASSETS ───────────────────────────────────────────────────────

assets:
  illustrations:
    - src/assets/illustration/heroIllustration.svg
    - src/assets/illustration/systemIllustration.svg
    - src/assets/illustration/header-rosetta.svg
    - src/assets/illustration/header-stemma.svg
    - src/assets/illustration/header-civitas.svg
    - src/assets/illustration/agentPortrait-system-core.svg
    - src/assets/illustration/agentPortrait-system-product.svg
    - src/assets/illustration/agentPortrait-system-implementation.svg
    - src/assets/illustration/codeblock-terminal-components.svg
    - src/assets/illustration/codeblock-terminal-mcp.svg
    - src/assets/illustration/codeblock-terminal-tokens.svg
    - src/assets/illustration/codeblock-terminal-contracts.svg
  backgrounds:
    - src/assets/background/bkgrnd-halftone.png
    - src/assets/background/bkgrnd-peter.jpg
  fonts:
    - src/assets/fonts/figtree/figtree.css (body)
    - src/assets/fonts/commit-mono/commit-mono.css (mono)
    - Google Fonts: Rajdhani 500/600/700 (display)
  logos:
    - primitive-assets/designerPunkLogo.svg

# ─── SECTIONS (detailed ui-tree follows) ──────────────────────────

sections:
  - nav
  - hero
  - stats
  - why-build
  - ecosystem
  - how-built
  - enterprise
  - code-shots
  - who-built
  - agents
  - thanks
  - cta
  - footer

# ─── UI TREE: SIMPLE SECTIONS ─────────────────────────────────────

ui-tree:

  # ─── NAV ──────────────────────────────────────────────────────
  - element: nav
    aria-label: "Site navigation"
    position: sticky
    tokens:
      background: black-300
      border-bottom: border-width-100, color.structure.border.subtle
      box-shadow: shadow.container
      min-height: tapAreaRecommended
      padding-inline: space500
    children:
      - element: div.nav__logo
        tokens:
          gap: space100
        children:
          - element: img
            props:
              src: primitive-assets/designerPunkLogo.svg
              alt: "DesignerPunk"
              filter: invert(1)
            tokens:
              height: 16px (icon sizing — no token, decorative logo)
          - element: div.nav__logo-credit
            content: "by 3fn Design"
            tokens:
              font-size: fontSize050
              color: color.contrast.onDark
              opacity: opacity064
      - element: div.nav__links
        tokens:
          gap: space400
        children:
          - element: a
            props: { href: "#about", content: "About" }
            tokens:
              font: typography.labelMd
              color: color.contrast.onDark
              opacity: opacity088
              transition: opacity duration150 easingStandard
          - element: a
            props: { href: "https://github.com/3fn/DesignerPunkv2", target: "_blank", rel: "noopener", content: "GitHub" }
          - element: a
            props: { href: "https://linkedin.com/in/petermichaelsallen", target: "_blank", rel: "noopener", content: "LinkedIn" }
    responsive:
      mobile: padding-inline reduces to space300

  # ─── HERO ─────────────────────────────────────────────────────
  - element: section#hero
    tokens:
      max-width: product-layout-content-max-width
      margin: 0 auto
      padding-inline: space500
      gap: space400
    layout:
      desktop: grid, 1fr 1fr, align-items start
      tablet: grid, 1fr (single column, visual first via order -1)
      mobile: grid, 1fr, padding-inline space300, padding-block space600
    children:
      - element: div.hero__content
        tokens:
          gap: space300
          margin-top: size1000 (80px — snapped from 88px per Spec 002)
          padding-top: space800
        children:
          - element: h1
            content: "The design system built for<br><em>AI-Human collaboration</em>"
            tokens:
              font-family: font-family-display
              font-size: fontSize800 (48px)
              font-weight: typography-display-font-weight
              line-height: 1.1
              color: color.contrast.onLight
              padding-left: product-layout-content-indent
            children:
              - element: em
                tokens:
                  font-style: normal
                  color: color.action.primary
          - element: p.hero__description
            content: "While modern teams explore how they might build AI-enabled design systems, I built something more."
            tokens:
              font: typography.bodyMd
              color: color.text.default
              max-width: product-layout-prose-measure-max
              padding-left: product-layout-content-indent
          - element: p.hero__description
            content: "<strong>DesignerPunk</strong> is an ecosystem that pairs an enterprise-ready design system with built-in intelligence layers that guide AI agents to deliver craft at scale."
            tokens:
              font: typography.bodyMd
              color: color.text.default
              max-width: product-layout-prose-measure-max
              padding-left: product-layout-content-indent
            children:
              - element: strong
                tokens:
                  color: color.action.primary
                  font-weight: fontWeight400
          - element: div.hero__ctas
            tokens:
              gap: space200
              margin-top: space200
              margin-left: product-layout-content-indent
            children:
              - element: a (Button-CTA)
                props: { variant: primary, label: "Explore the ideas", href: "#why-build" }
                tokens:
                  background: color.action.primary
                  color: color.contrast.onAction
                  padding: space150 space300
                  font: typography.buttonMd
                  border-radius: radius.small
              - element: a (Button-CTA)
                props: { variant: secondary, label: "Investigate the code", href: "https://github.com/3fn/DesignerPunkv2", target: "_blank", rel: "noopener" }
                tokens:
                  background: color.structure.surface
                  color: color.contrast.onLight
                  border: border-width-100, color.contrast.onLight
                  padding: space150 space300
                  font: typography.buttonMd
                  border-radius: radius.small
      - element: div.hero__visual
        a11y: aria-hidden content (decorative illustration + chord diagram)
        children:
          - element: object
            props: { type: "image/svg+xml", data: "src/assets/illustration/heroIllustration.svg", aria-hidden: "true" }
          - element: div.hero__chord
            interaction: chord-diagram (see Task 8.2)
            children:
              - element: canvas#chord
                a11y: aria-hidden="true"
    responsive:
      tablet: single column, visual moves to order -1 (above content), max-width 400px
      mobile: visual max-width 300px, padding-block space600

  # ─── STATS ────────────────────────────────────────────────────
  - element: section#stats
    tokens:
      padding-block: space250 (20px)
      border-top: border-width-100, gray-300
      border-bottom: border-width-100, gray-300
    decoration:
      noise-texture: feTurbulence baseFrequency 0.9, opacity056
    layout:
      desktop: grid, 3fr 9fr, max-width product-layout-content-max-width, margin 0 auto
    children:
      - element: div.stats__hero
        tokens:
          padding-right: space500
          border-right: border-width-100, color.structure.border
        children:
          - element: div.stats__hero-number
            content: "1"
            tokens:
              font-family: font-family-display
              font-size: fontSize1200 (64px)
              font-weight: fontWeight700
              color: color.action.primary
              line-height: 1
          - element: div.stats__hero-label
            content: "Human"
            tokens:
              font-size: fontSize050
              font-weight: fontWeight600
              color: pink-500
              text-transform: uppercase
              letter-spacing: 0.04em
      - element: div.stats__items
        layout: grid, repeat(5, 1fr), row-gap space150
        children:
          - element: div.stats__item
            repeat: 10 items (217 Primitive tokens, 193 Semantic tokens, 9 Component families, 34 Foundation components, 210 Contracts, 8 AI Agents, 3 MCP servers, -87% Context load, 300+ Test suites, 8k+ Governance tests)
            children:
              - element: span.stats__value
                tokens:
                  font-family: font-family-display
                  font-size: fontSize200 (22px — snapped from 22px per Spec 002)
                  font-weight: fontWeight700
                  color: color.text.heading
              - element: span.stats__label
                tokens:
                  font-size: fontSize050
                  font-weight: fontWeight500
                  color: color.text.default

  # ─── ENTERPRISE ───────────────────────────────────────────────
  - element: section#enterprise
    tokens:
      padding-block: space.sectioned.generous (96px)
      max-width: product-layout-content-max-width
      margin: 0 auto
      padding-inline: space500
    children:
      - element: h2
        content: "What makes this system enterprise-grade?"
        tokens:
          font-family: font-family-display
          font-size: typography.h2 (fontSize500 = 33px)
          font-weight: fontWeight700
          color: color.text.heading
          margin-bottom: space700
          margin-left: product-layout-content-indent
        children:
          - element: span.section-prefix
            content: "//"
            a11y: aria-hidden="true"
            tokens:
              position: absolute, left -36px
              color: color.text.muted
      - element: div.enterprise__grid
        layout: grid, 1fr 1fr, gap 40px 72px (space500 × space900)
        tokens:
          padding-inline: product-layout-content-indent
        children:
          - element: div.enterprise__item
            repeat: 6 items (Validated frameworks, Accessibility, AI intelligence layers, Multi-platform scale, Encoded governance, Design-code sync)
            children:
              - element: h3
                tokens:
                  font-family: font-family-display
                  font-size: fontSize150 (17px)
                  font-weight: fontWeight700
                  color: color.text.heading
                  margin-bottom: space075
              - element: p
                tokens:
                  font-size: fontSize300 (18px)
                  line-height: 1.52
                  color: color.text.default

  # ─── CODE SHOTS (div within enterprise flow, not a section landmark) ─
  - element: div#code-shots
    note: "Not a <section> landmark — decorative code screenshots"
    tokens:
      padding-top: space400
      padding-bottom: space.sectioned.generous
      overflow: hidden
    layout: grid, repeat(4, 1fr), gap 0
    children:
      - element: object
        repeat: 4 (codeblock-terminal-components, codeblock-terminal-mcp, codeblock-terminal-tokens, codeblock-terminal-contracts)
        props: { type: "image/svg+xml", aria-hidden: "true" }
        tokens:
          width: calc(100% + (100% / 3))
          border-radius: radius.075
          box-shadow: shadow.container
        decoration:
          nth-child(2), nth-child(4): margin-top space400

  # ─── FOOTER ───────────────────────────────────────────────────
  - element: footer
    tokens:
      background: black-500
      padding-block: space250 (22px — snapped from 22px)
    children:
      - element: div.footer__inner
        tokens:
          max-width: product-layout-content-max-width
          margin: 0 auto
          padding-inline: space500
        layout: flex, justify-content space-between, align-items center
        children:
          - element: div.footer__logo
            children:
              - element: img
                props: { src: "primitive-assets/designerPunkLogo.svg", alt: "DesignerPunk" }
                tokens:
                  height: fontSize050 (13px)
                  filter: invert(1)
          - element: div.footer__info
            tokens:
              gap: space175 (14px — nearest space175 if exists, else hard value)
              font-size: fontSize050
              color: rgba(255,255,255,0.6) (application-level — no semantic for footer muted text on dark)
            children:
              - element: span
                content: "Peter Michaels Allen"
              - element: span.footer__sep
                content: "◇"
                tokens:
                  opacity: opacity032
              - element: span
                content: "peter[at]designerpunk.ai"

# ─── UI TREE: CONTENT SECTIONS ────────────────────────────────────

  # ─── WHY BUILD ────────────────────────────────────────────────
  - element: section#why-build
    tokens:
      padding-top: space.sectioned.expansive (128px — snapped from 120px)
      padding-bottom: space.sectioned.generous (96px)
      max-width: product-layout-content-max-width
      margin: 0 auto
      padding-inline: space500
    children:
      - element: h2
        content: "Why build this system?"
        tokens:
          font-family: font-family-display
          font-size: typography.h2 (fontSize500)
          font-weight: fontWeight700
          color: color.text.heading
          margin-bottom: space700
          margin-left: product-layout-content-indent
          cursor: default
        children:
          - element: span.section-prefix
            content: "//"
            a11y: aria-hidden="true"
            tokens:
              position: absolute, left -36px
              color: color.text.muted
        interaction:
          trigger: hover
          behavior: reveals easter egg sibling
      - element: p.why-build__easter
        content: "Because why not!?"
        a11y: aria-hidden="true" (decorative)
        tokens:
          font-family: font-family-display
          font-size: fontSize1200 (72px)
          font-weight: fontWeight700
          color: green-100
          position: absolute, top 80px, right 155px
          opacity: 0 (default hidden)
        interaction: easter-egg (see Task 8.4)
      - element: blockquote.why-build__quote
        content: "When I first tried to build something serious with AI, it became clear: the only way to build something sustainable is to build <em>on</em> something sustainable."
        tokens:
          font-family: font-family-display
          font-size: fontSize200 (22px)
          font-weight: fontWeight500
          line-height: 1.4
          color: color.print.default
          border-left: 3px solid color.action.primary
          padding-left: product-layout-content-indent
          margin: 0 0 space700 product-layout-content-indent
          max-width: product-layout-quote-max-width
        children:
          - element: em
            tokens:
              font-style: normal
              color: color.action.primary
              font-weight: fontWeight700
      - element: div.why-build__cards
        layout: grid, repeat(4, 1fr), gap 0
        children:
          - element: div.why-build__card
            repeat: 4 (Challenge, Insight, Approach, Goals)
            tokens:
              padding: space450 space350 (36px 28px — snapped to space400 32px block, space350 28px inline per Spec 002)
              border-left: border-width-100, color.structure.border
            decoration:
              first-child: border-left transparent
              hover: background green-300, border-left/right green-500, transition 150ms
            children:
              - element: h3
                tokens:
                  font-family: font-family-display
                  font-size: fontSize175 (20px)
                  font-weight: fontWeight700
                  color: color.text.heading
                  padding-bottom: space175 (14px)
                  border-bottom: border-width-200, color.text.heading
                  margin-bottom: space200
              - element: p
                repeat: 2-3 per card
                tokens:
                  font-size: fontSize100 (14px)
                  line-height: 1.65
                  color: color.print.default
                  margin-top: space150 (between paragraphs via p + p)

  # ─── HOW BUILT ───────────────────────────────────────────────
  - element: section#how-built
    props:
      position: relative (for easter egg positioning)
    tokens:
      padding-block: space.sectioned.expansive (128px)
      max-width: product-layout-content-max-width
      margin: 0 auto
      padding-inline: space500
      background: color.structure.surface
    children:
      - element: h2
        content: "How was this system built?"
        tokens:
          font-family: font-family-display
          font-size: typography.h2 (fontSize500)
          font-weight: fontWeight700
          color: color.text.heading
          margin-bottom: space700
          margin-left: product-layout-content-indent
          cursor: default
        children:
          - element: span.section-prefix
            content: "//"
            a11y: aria-hidden="true"
            tokens:
              position: absolute, left -36px
              color: color.text.muted
        interaction:
          trigger: hover
          behavior: reveals easter egg sibling
      - element: p.how-built__easter
        content: "Hard $#@%ing work!"
        a11y: aria-hidden="true" (decorative)
        tokens:
          font-family: font-family-display
          font-size: fontSize1200 (72px)
          font-weight: fontWeight700
          color: pink-100
          position: absolute, top 80px, right 155px
          opacity: 0 (default hidden)
        interaction: easter-egg-pink (see Task 8.4)
      - element: div.how-built__grid
        layout: grid, 7fr 5fr, gap space900 (72px)
        tokens:
          padding-inline: product-layout-content-indent
        children:
          - element: div.how-built__featured
            tokens:
              font-family: font-family-display
              font-size: fontSize700 (42px)
              font-weight: fontWeight700
              line-height: 1.24
              color: color.text.heading
            children:
              - element: p
                content: "DesignerPunk was built using Claude models, primarily through <span>Kiro CLI</span>."
              - element: p
                content: "All work was designed and planned myself utilizing a <span>spec-driven methodology</span> with <span>Human-AI collaboration models</span>."
                tokens:
                  margin-top: space350 (28px)
              - children span:
                  tokens:
                    color: color.action.primary
          - element: div.how-built__body
            tokens:
              margin-top: space150
            children:
              - element: p
                content: "After three failed attempts to create a traditional design system, I explored new practices that leaned into agent tendencies."
                tokens:
                  font-size: typography.bodyMd (fontSize250 = 16px)
                  line-height: 1.5
              - element: p
                content: "What came from those failures was a thesis of three principles:"
                tokens:
                  margin-top: space200
              - element: ol
                tokens:
                  list-style-position: inside
                  padding: space100 space200
                children:
                  - element: li
                    repeat: 3 (Every decision must be queryable, Every decision must be validatable, Institutional context must persist across sessions)
                    tokens:
                      margin: space100
                      font-weight: fontWeight700
                      color: color.text.default
              - element: p
                content: "Once the foundations of tokens, components, and frameworks were established..."
                tokens:
                  margin-top: space200
              - element: p
                content: "DesignerPunk is not built to integrate with an existing system. It's a 0-1, AI-centric solution..."
                tokens:
                  margin-top: space200
              - element: p
                content: "Most big-box design systems drive a specific aesthetic. DesignerPunk is built to power <em>yours</em>."
                tokens:
                  margin-top: space200

  # ─── WHO BUILT (includes agents + thanks as subsections) ──────
  - element: section#who-built
    id: about
    tokens:
      padding-top: space.sectioned.generous (96px)
      max-width: product-layout-content-max-width
      margin: 0 auto
      padding-inline: space500
    children:
      - element: h2
        content: "Who built, and maintains, this system?"
        tokens:
          font-family: font-family-display
          font-size: typography.h2 (fontSize500)
          font-weight: fontWeight700
          color: color.text.heading
          margin-bottom: space600
          margin-left: product-layout-content-indent
        children:
          - element: span.section-prefix
            content: "//"
            a11y: aria-hidden="true"
            tokens:
              color: color.text.muted
      - element: div.who-built__copy

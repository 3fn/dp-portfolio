category: layout
description: Structural layout constraints for the portfolio page

tokens:
  contentMaxWidth:
    value: 1336
    unitType: logical
    description: Maximum content column width
    rationale: "Optimized for 70-75 characters per line at body font size across common viewport widths. Not a base-8 multiple — product-specific layout decision."
    platforms: [web, ios, android]

  contentIndent:
    ref: space300
    description: Left indent for section content and headings
    platforms: [web, ios, android]

  proseMeasureMax:
    value: 48
    unitType: ch
    description: Maximum line length for body text
    rationale: "Typographic best practice for readability. Character-width unit — web-only concept."
    platforms: [web]

  quoteMaxWidth:
    value: 640
    unitType: logical
    description: Maximum width for blockquote elements
    rationale: "Narrower than content column for visual distinction. Not a base-8 multiple."
    platforms: [web, ios, android]

  modalMaxWidth:
    value: 1020
    unitType: logical
    description: Maximum width for ecosystem detail modals
    rationale: "Accommodates two-column layout (copy + visualization) at comfortable reading width."
    platforms: [web, ios, android]

  ctaActionsMaxWidth:
    value: 280
    unitType: logical
    description: Maximum width for CTA button group
    rationale: "Constrains button width for visual balance against adjacent featured text."
    platforms: [web, ios, android]

  illustrationMaxWidth:
    value: 380
    unitType: logical
    description: Maximum width for ecosystem system illustration
    rationale: "Balanced against flanking system cards in 3-column layout."
    platforms: [web, ios, android]

  cardHeaderMaxWidth:
    value: 180
    unitType: logical
    description: Maximum width for system card SVG headers
    rationale: "Proportional to card width — prevents header from dominating card content."
    platforms: [web, ios, android]

  ctaBottomPadding:
    value: 224
    unitType: logical
    description: Bottom padding for CTA section
    rationale: "Creates visual weight and space for background image reveal. Decorative — not derived from spacing scale."
    platforms: [web]

  tooltipMaxWidth:
    value: 270
    unitType: logical
    description: Maximum width for career tooltip
    rationale: "Constrained for readability at tooltip mono font size. Content-specific — not derived from system layout tokens."
    platforms: [web]

  chordTipMaxWidth:
    value: 260
    unitType: logical
    description: Maximum width for chord diagram tooltip
    rationale: "Slightly narrower than career tooltip — less content density. Content-specific."
    platforms: [web]

  vizBranchGapColumn:
    ref: space150
    description: Column gap for visualization branch grid layout
    platforms: [web]

  vizBranchGapRow:
    ref: space050
    description: Row gap for visualization branch grid layout
    platforms: [web]

  vizBranchMarginTop:
    ref: space100
    description: Top margin for visualization branch container
    platforms: [web]

  sectionPrefixOffset:
    value: -36
    unitType: logical
    description: Negative inline offset for section prefix labels
    rationale: "Positions prefix text outside the content column for visual hierarchy. Tuned to prefix text width + breathing room."
    platforms: [web]

  modalHeaderMaxWidth:
    value: 200
    unitType: logical
    description: Maximum width for ecosystem modal header SVG
    rationale: "Constrains modal header proportionally to modal width. Distinct from cardHeaderMaxWidth (180) — modal has more space."
    platforms: [web]

  vizIndent:
    ref: space250
    description: Indentation for nested visualization code lines
    platforms: [web]

  heroVisualMaxTablet:
    value: 400
    unitType: logical
    description: Maximum width for hero illustration at tablet breakpoint
    rationale: "Constrains illustration to prevent overwhelming single-column layout. Proportional to tablet viewport."
    platforms: [web]

  heroVisualMaxMobile:
    value: 300
    unitType: logical
    description: Maximum width for hero illustration at mobile breakpoint
    rationale: "Further constrains illustration for narrow viewports. Maintains visual balance with text content below."
    platforms: [web]

  tokenEvolutionStickyOffset:
    value: 120
    unitType: logical
    description: Top offset for sticky token evolution cluster in Why Build section
    rationale: "Nav height (48px) + section heading clearance. Positions sticky element below fixed nav with breathing room. No system spacing token at 120px."
    platforms: [web]
